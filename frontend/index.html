<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#172B4D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KaamSetu" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>KaamSetu - Labour & Attendance SaaS</title>
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-surface-bg text-navy font-sans antialiased selection:bg-navy selection:text-white">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#F4F5F7;font-family:'Inter',sans-serif;padding:16px;">
        <div style="background:#fff;border:1px solid #DFE1E6;padding:28px;max-width:360px;width:100%;box-shadow:0 1px 3px rgba(9,30,66,0.08);text-align:center;border-radius:2px;">
          <div style="width:40px;height:40px;margin:0 auto 16px;border:3px solid #EBECF0;border-top-color:#172B4D;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
          <h2 style="font-size:14px;font-weight:800;color:#172B4D;letter-spacing:0.5px;margin:0 0 6px 0;text-transform:uppercase;">
            KaamSetu कामसेतु
          </h2>
          <p style="font-size:12px;color:#5E6C84;margin:0 0 16px 0;">
            Initializing Labour Management SaaS Platform...
          </p>
          <div style="width:100%;background:#EBECF0;height:4px;border-radius:2px;overflow:hidden;">
            <div style="background:#172B4D;width:40%;height:100%;animation:indeterminate 1.5s infinite ease-in-out;"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes indeterminate { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
